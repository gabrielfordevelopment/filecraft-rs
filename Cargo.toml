[workspace]
resolver = "3"
members = ["crates/filecraft-core", "crates/filecraft"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
filecraft-core = { path = "crates/filecraft-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "glow", "system_fonts", "wayland", "x11"] }
egui = { version = "0.37", default-features = false }
etcetera = "0.11"
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
lofty = "0.25"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
